<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="index.css">
    <title>Wedding Website</title>
</head>
<body>
    <div id="password-screen" role="dialog" aria-label="Voer het wachtwoord in">
    <p class="pw-title">Wedding festival</p>
    <p class="pw-subtitle">Gijs & Frederieke</p>
    <div class="ornament">✦ ✦ ✦ ✦</div>
 
    <div class="pw-form">
      <input
        type="password"
        id="pw-input"
        placeholder="wachtwoord"
        autocomplete="off"
        aria-label="Wachtwoord"
      />
      <button id="pw-btn" type="button">Betreden</button>
      <p class="pw-error" id="pw-error" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
